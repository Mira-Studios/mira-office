[package]
name = "mira_office_app"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[dependencies]
tauri = { version = "1", features = [] }
reqwest = { version = "0.11", features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
hex = "0.4"
mime_guess = "2.0"
anyhow = "1.0"

[build-dependencies]
tauri-build = { version = "1", features = [] }
